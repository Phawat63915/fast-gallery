services:
  db:
    image: postgres:18-alpine
    container_name: fastgallery-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastgallery
    ports:
      - "5432:5432"
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c effective_cache_size=1GB
      -c wal_buffers=16MB
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c autovacuum_vacuum_scale_factor=0.05
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastgallery"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
    driver: local
