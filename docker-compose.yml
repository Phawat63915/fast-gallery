services:
  db:
    image: postgres:18-alpine
    container_name: fastgallery-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastgallery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastgallery"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
    driver: local
